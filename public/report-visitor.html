<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Visitor Report · Alok Industries VMS</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <script src="/js/theme.js"></script>
  <div class="app-shell">
    <div id="sidebar-mount"></div>
    <div class="main-col">
      <div id="topbar-mount"></div>
      <div class="page-body">
        <div class="card">
          <div class="card-header"><h2>Visitor Report</h2></div>
          <div class="card-body">
            <div class="grid-4">
              <div class="field">
                <label for="rp-type">Type</label>
                <select id="rp-type"><option value="">All</option></select>
              </div>
              <div class="field">
                <label for="rp-mobile">Mobile</label>
                <input type="text" id="rp-mobile" placeholder="Search mobile" />
              </div>
              <div class="field">
                <label for="rp-from">From Date</label>
                <input type="date" id="rp-from" />
              </div>
              <div class="field">
                <label for="rp-to">To Date</label>
                <input type="date" id="rp-to" />
              </div>
            </div>
            <div class="flex gap-8">
              <button class="btn btn-secondary" id="rp-filter-btn">Search</button>
              <button class="btn btn-primary" id="rp-export-btn">Export CSV</button>
            </div>
            <div class="stat-row mt-16" id="rp-summary"></div>
          </div>
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Token No</th><th>Card No</th><th>In Date</th><th>In Time</th><th>Reason for Visit</th>
                  <th>Visitor Name</th><th>Representing</th><th>Address</th><th>Mobile</th>
                  <th>Contact Person</th><th>Department</th><th>Category</th><th>Status</th>
                </tr>
              </thead>
              <tbody id="rp-body"><tr class="empty-row"><td colspan="13">Loading…</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/report-visitor.js"></script>
</body>
</html>
