<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Password Reset · Alok Industries VMS</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <script src="/js/theme.js"></script>
  <div class="app-shell">
    <div id="sidebar-mount"></div>
    <div class="main-col">
      <div id="topbar-mount"></div>
      <div class="page-body">
        <div class="card" style="max-width:440px;">
          <div class="card-header"><h2>Change Password</h2></div>
          <div class="card-body">
            <div class="error-banner" id="pr-error"></div>
            <div class="error-banner" id="pr-success" style="background:var(--success-bg);color:var(--success);"></div>
            <form id="pr-form">
              <div class="field">
                <label for="pr-current">Current Password</label>
                <input type="password" id="pr-current" required autocomplete="current-password" />
              </div>
              <div class="field">
                <label for="pr-new">New Password</label>
                <input type="password" id="pr-new" minlength="6" required autocomplete="new-password" />
              </div>
              <div class="field">
                <label for="pr-confirm">Confirm New Password</label>
                <input type="password" id="pr-confirm" minlength="6" required autocomplete="new-password" />
              </div>
              <button type="submit" class="btn btn-primary btn-block" id="pr-btn">Update Password</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/password-reset.js"></script>
</body>
</html>
