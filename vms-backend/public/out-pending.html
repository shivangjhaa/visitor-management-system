<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Out Pending List · Alok Industries VMS</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <script src="/js/theme.js"></script>
  <div class="app-shell">
    <div id="sidebar-mount"></div>
    <div class="main-col">
      <div id="topbar-mount"></div>
      <div class="page-body">
        <div class="card">
          <div class="card-header">
            <h2>Out Pending List</h2>
            <button class="link-btn" id="refresh-onsite">Refresh</button>
          </div>
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Token No</th><th>Visitor Name</th><th>Representing</th><th>Mobile</th>
                  <th>Requestor</th><th>Purpose</th><th>Appointment Date &amp; Time</th><th>In Time</th><th>Action</th>
                </tr>
              </thead>
              <tbody id="onsite-body"><tr class="empty-row"><td colspan="9">Loading…</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/out-pending.js"></script>
</body>
</html>
