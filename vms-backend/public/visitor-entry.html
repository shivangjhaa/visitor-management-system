<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Visitor Entry · Alok Industries VMS</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <script src="/js/theme.js"></script>
  <div class="app-shell">
    <div id="sidebar-mount"></div>
    <div class="main-col">
      <div id="topbar-mount"></div>
      <div class="page-body">
        <div class="card">
          <div class="card-header"><h2>Fetch Appointment</h2></div>
          <div class="card-body">
            <form id="verify-form" class="flex gap-12" style="align-items:flex-end;">
              <div class="field" style="flex:1;margin-bottom:0;">
                <label for="inwardInput">Token / Inward Number</label>
                <input type="text" id="inwardInput" class="mono" placeholder="e.g. INW-20260706-0001" required />
              </div>
              <button type="submit" class="btn btn-primary" id="verify-btn">Fetch</button>
            </form>
          </div>
        </div>

        <div class="card mt-24" id="result-card" style="display:none;"></div>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/visitor-entry.js"></script>
</body>
</html>
